name: CI

# Every pull request and every push to main or a release branch: build, unit tests and the format check.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ProfitFox.MarketData.sln

      - name: Build
        run: dotnet build backend/ProfitFox.MarketData.sln --no-restore

      - name: Test
        run: dotnet test backend/ProfitFox.MarketData.sln --no-build

      - name: Verify format
        run: dotnet format backend/ProfitFox.MarketData.sln --verify-no-changes --no-restore
